services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heaven_pass
      POSTGRES_PASSWORD: heaven_pass
      POSTGRES_DB: heaven_pass
    ports:
      - "5432:5432"
    volumes:
      - heaven_pass_postgres:/var/lib/postgresql/data

volumes:
  heaven_pass_postgres:
